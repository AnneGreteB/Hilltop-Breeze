# Sveltia CMS configuration — this file defines what the /admin panel can edit.
# Before first use, replace the two placeholders below (repo and base_url).
# See SETUP.md at the repo root for the full one-time setup walkthrough.

backend:
  name: github
  repo: AnneGreteB/Hilltop-Breeze
  branch: main
  base_url: https://YOUR-AUTH-WORKER.workers.dev # <-- replace with your sveltia-cms-auth Worker URL

site_url: https://casa-hilltopbreeze.com
media_folder: public/images/uploads
public_folder: /images/uploads

# Automatically convert uploaded photos to compressed WebP so a 12 MB phone
# photo never lands on the site at full size.
media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 85
          max_width: 2400
          max_height: 2400

collections:
  - name: content
    label: Website content
    editor:
      preview: false
    files:
      - name: home
        label: Homepage — intro & about
        file: content/home.json
        fields:
          - name: hero
            label: Top of the page
            widget: object
            fields:
              - name: eyebrow
                label: Small line above the title
                widget: string
              - name: title
                label: Main title
                widget: string
              - name: subtitle
                label: Text under the title
                widget: text
              - name: image
                label: Big background photo
                widget: image
                hint: Use a wide landscape photo — this fills the whole screen.
              - name: imageAlt
                label: Photo description
                widget: string
                hint: A short sentence describing the photo, used by Google and screen readers.
          - name: about
            label: About section
            widget: object
            fields:
              - name: heading
                label: Heading
                widget: string
              - name: text
                label: Paragraph
                widget: text
              - name: image
                label: Photo
                widget: image
              - name: imageAlt
                label: Photo description
                widget: string
              - name: amenities
                label: Amenities (bullet points)
                widget: list
                field:
                  name: item
                  label: Amenity
                  widget: string

      - name: apartments
        label: The apartments
        file: content/apartments.json
        fields:
          - name: heading
            label: Section heading
            widget: string
          - name: intro
            label: Intro paragraph
            widget: text
          - name: apartments
            label: Apartments
            widget: list
            summary: "{{fields.name}}"
            fields:
              - name: name
                label: Name
                widget: string
              - name: description
                label: Short description
                widget: text
              - name: airbnbUrl
                label: Airbnb link
                widget: string
                hint: Paste the full link to this apartment's Airbnb page.
              - name: image
                label: Photo
                widget: image
              - name: imageAlt
                label: Photo description
                widget: string

      - name: explore
        label: Explore the island
        file: content/explore.json
        fields:
          - name: heading
            label: Section heading
            widget: string
          - name: intro
            label: Intro line
            widget: string
          - name: items
            label: Things to do
            widget: list
            summary: "{{fields.title}}"
            fields:
              - name: title
                label: Title
                widget: string
              - name: text
                label: Description
                widget: text
              - name: image
                label: Photo
                widget: image
              - name: imageAlt
                label: Photo description
                widget: string

      - name: location
        label: Location
        file: content/location.json
        fields:
          - name: heading
            label: Heading
            widget: string
          - name: text
            label: Paragraph
            widget: text
          - name: mapQuery
            label: Map location
            widget: string
            hint: The place shown on the map, e.g. "Jan Thiel, Curaçao". An exact address works too.

      - name: settings
        label: Contact details & site settings
        file: content/settings.json
        fields:
          - name: siteName
            label: Site name
            widget: string
          - name: metaTitle
            label: Browser tab / Google title
            widget: string
          - name: metaDescription
            label: Google search description
            widget: text
          - name: phone
            label: Phone number
            widget: string
            hint: Include the country code, e.g. +5999 565 1242.
          - name: email
            label: Email address
            widget: string
          - name: whatsapp
            label: WhatsApp number
            widget: string
            hint: Include the country code. Usually the same as the phone number.
          - name: instagram
            label: Instagram username
            widget: string
            hint: Just the username, without the @.
          - name: footerTagline
            label: Footer tagline
            widget: string
          - name: footerLocation
            label: Footer location line
            widget: string
